name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.json
      - icon-512.png
      - .github/workflows/build-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan isi aplikasi
        run: |
          mkdir www
          cp index.html manifest.json www/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png www/

      - name: Pasang Capacitor dan buat proyek Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "CS Gudang" id.cs.gudang --web-dir www
          npx cap add android
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 29/' android/variables.gradle

      - name: Tambah penyimpan file cadangan (plugin GaleriSimpan)
        run: |
          D=android/app/src/main/java/id/cs/gudang
          mkdir -p $D
          cat > $D/GaleriSimpan.java <<'EOF'
          package id.cs.gudang;

          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "GaleriSimpan")
          public class GaleriSimpan extends Plugin {
            @PluginMethod
            public void simpan(PluginCall call) {
              String nama = call.getString("nama");
              String data = call.getString("data");
              String mime = call.getString("mime", "application/octet-stream");
              if (nama == null || data == null) {
                call.reject("Data kosong");
                return;
              }
              try {
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                Context ctx = getContext();
                boolean gambar = mime.startsWith("image/");
                ContentValues v = new ContentValues();
                v.put(MediaStore.MediaColumns.DISPLAY_NAME, nama);
                v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                v.put(MediaStore.MediaColumns.RELATIVE_PATH,
                    (gambar ? Environment.DIRECTORY_PICTURES : Environment.DIRECTORY_DOWNLOADS) + "/CS Gudang");
                Uri tabel = gambar ? MediaStore.Images.Media.EXTERNAL_CONTENT_URI : MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                Uri uri = ctx.getContentResolver().insert(tabel, v);
                if (uri == null) throw new Exception("Tidak bisa membuat file");
                try (OutputStream os = ctx.getContentResolver().openOutputStream(uri)) {
                  os.write(bytes);
                }
                JSObject r = new JSObject();
                r.put("ok", true);
                call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package id.cs.gudang;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(GaleriSimpan.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF

      - name: Pasang ikon CS
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            mkdir -p $R/mipmap-$d
            magick icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Kunci tanda tangan tetap
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Bangun APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CS-Gudang-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
